<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
<title>西暦⇔元号 変換</title>
<style>
  body { font-family: sans-serif; background: #f4f7f6; padding: 20px; max-width: 600px; margin: auto; color: #333; display: flex; flex-direction: column; min-height: 95vh; box-sizing: border-box; }
  .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; margin-top: 10px; }
  .header-container h2 { margin: 0; text-align: left; }
  .clear-btn { padding: 8px 15px; background: #ddd; color: #333; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; font-family: inherit; transition: 0.2s; }
  .clear-btn:hover { background: #ccc; }

  /* スマホではタイトルとクリアボタンを縦に並べ、重なりを防止 */
  @media (max-width: 480px) {
    body { padding: 14px; }
    .header-container {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }
    .clear-btn {
      align-self: flex-end;
    }
    #panel-table { padding: 10px !important; }
    .table-scroll { max-height: 76vh; }
    th, td { padding: 9px 6px; }
  }
  /* タブ */
  .tabs { display: flex; flex-wrap: wrap; margin-bottom: 0; }
  .tab-btn { flex: 1; padding: 12px; cursor: pointer; border: none; background: #ddd; border-radius: 5px 5px 0 0; font-size: 15px; font-family: inherit; margin-right: 2px; min-width: 100px; }
  .tab-btn:last-child { margin-right: 0; }
  .tab-btn.active { background: #3498db; color: #fff; font-weight: bold; }

  /* パネル */
  .panel { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .tab-panel { display: none; background: #fff; padding: 30px; border-radius: 0 5px 5px 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .tab-panel.active { display: block; }

  label { display: block; font-weight: bold; color: #555; margin-bottom: 8px; font-size: 14px; }
  input[type="number"], select { width: 100%; padding: 12px 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; font-family: inherit; transition: 0.2s; }
  input[type="number"]:focus, select:focus { outline: none; border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }

  .row { display: flex; gap: 15px; margin-bottom: 15px; }
  .row > div { flex: 1; }
  .input-group { margin-bottom: 15px; }
  button.action { padding: 12px 20px; background: #27ae60; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: 0.2s; font-weight: bold; width: 100%; margin-top: 5px; }
  button.action:hover { background: #219150; }

  /* 結果表示 */
  .result { margin-top: 20px; padding: 20px; border-radius: 6px; text-align: center; font-size: 20px; font-weight: bold; display: none; border: 1px solid transparent; }
  .result.show { display: block; }
  .result.success { background: #f9f9f9; color: #2980b9; border-color: #eee; }
  .result.error { background: #fdf2f2; color: #c0392b; border-color: #e0bfbf; font-size: 16px; }

  /* テーブル共通 */
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 0; }
  th, td { padding: 10px; text-align: center; border: 1px solid #ddd; }
  th { background: #f0f3f5; color: #555; font-weight: bold; }

  /* 早見表スクロールエリア */
  .table-scroll { max-height: 70vh; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; }
  .table-scroll th { position: sticky; top: 0; z-index: 1; box-shadow: 0 1px 0 #ddd; }
  .bg-even td { background: #f9f9f9; }
  .bg-odd td { background: #fff; }

  /* 早見表の中央の縦罫線 */
  #quick-reference-table th:first-child,
  #quick-reference-table td:first-child {
    border-right: 1px solid #ddd;
  }

  /* 下部 対応範囲テーブル */
  .era-table h3 { text-align: center; color: #555; margin-top: 0; margin-bottom: 15px; font-size: 16px; }
  .era-table tr:nth-child(even) td { background: #f9f9f9; }
</style>
</head>
<body>

<div class="header-container">
  <h2>西暦⇔元号 変換</h2>
  <button class="clear-btn" onclick="clearSettings()">クリア</button>
</div>
<div class="tabs">
  <button class="tab-btn" onclick="switchTab('panel-seireki', event)">西暦 → 元号</button>
  <button class="tab-btn" onclick="switchTab('panel-gengo', event)">元号 → 西暦</button>
  <button class="tab-btn active" onclick="switchTab('panel-table', event)">早見表</button>
</div>

<!-- 西暦 → 元号 -->
<div id="panel-seireki" class="tab-panel">
  <div class="input-group">
    <label for="seireki-input">🗓 西暦（年）を入力</label>
    <input type="number" id="seireki-input" placeholder="例: 2025" min="1868" max="2100">
  </div>
  <button class="action" onclick="convertToGengo()">元号に変換する</button>
  <div id="result-seireki" class="result"></div>
</div>

<!-- 元号 → 西暦 -->
<div id="panel-gengo" class="tab-panel">
  <div class="row">
    <div>
      <label for="gengo-select">🏷 元号を選択</label>
      <select id="gengo-select">
        <option value="meiji">明治</option>
        <option value="taisho">大正</option>
        <option value="showa">昭和</option>
        <option value="heisei" selected>平成</option>
        <option value="reiwa">令和</option>
      </select>
    </div>
    <div>
      <label for="gengo-year-input">📌 年を入力</label>
      <input type="number" id="gengo-year-input" placeholder="例: 7" min="1">
    </div>
  </div>
  <button class="action" onclick="convertToSeireki()">西暦に変換する</button>
  <div id="result-gengo" class="result"></div>
</div>

<!-- 早見表 -->
<div id="panel-table" class="tab-panel active" style="padding: 20px;">
  <div class="table-scroll">
    <table id="quick-reference-table">
      <thead>
        <tr>
          <!-- 幅を50%ずつに設定し、中央に罫線が来るように調整 -->
          <th style="width: 50%;">西暦</th>
          <th style="width: 50%;">元号</th>
        </tr>
      </thead>
      <tbody>
        <!-- JavaScriptで現在の年から動的に生成されます -->
      </tbody>
    </table>
  </div>
</div>

<!-- 下部 対応範囲テーブル -->
<div class="panel era-table" style="margin-top: 20px;">
  <h3>📋 元号一覧（対応範囲）</h3>
  <table>
    <thead><tr><th>元号</th><th>開始日</th><th>終了日</th></tr></thead>
    <tbody>
      <tr><td>明治</td><td>1868年1月25日</td><td>1912年7月29日</td></tr>
      <tr><td>大正</td><td>1912年7月30日</td><td>1926年12月24日</td></tr>
      <tr><td>昭和</td><td>1926年12月25日</td><td>1989年1月7日</td></tr>
      <tr><td>平成</td><td>1989年1月8日</td><td>2019年4月30日</td></tr>
      <tr><td>令和</td><td>2019年5月1日</td><td>—</td></tr>
    </tbody>
  </table>
</div>

<script>
const eras = [
  { name: '明治', key: 'meiji',  startYear: 1868, endYear: 1912, offset: 1867 },
  { name: '大正', key: 'taisho', startYear: 1912, endYear: 1926, offset: 1911 },
  { name: '昭和', key: 'showa',  startYear: 1926, endYear: 1989, offset: 1925 },
  { name: '平成', key: 'heisei', startYear: 1989, endYear: 2019, offset: 1988 },
  { name: '令和', key: 'reiwa',  startYear: 2019, endYear: 9999, offset: 2018 }
];

window.onload = () => {
  generateQuickReference(); // 早見表の動的生成
};

document.getElementById('seireki-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') convertToGengo(); });
document.getElementById('gengo-year-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') convertToSeireki(); });

function clearSettings() {
  document.getElementById('seireki-input').value = '';
  document.getElementById('result-seireki').className = 'result';
  document.getElementById('gengo-select').value = 'heisei';
  document.getElementById('gengo-year-input').value = '';
  document.getElementById('result-gengo').className = 'result';

  const activePanel = document.querySelector('.tab-panel.active').id;
  if (activePanel === 'panel-seireki') document.getElementById('seireki-input').focus();
  else if (activePanel === 'panel-gengo') document.getElementById('gengo-year-input').focus();
}

function switchTab(id, e) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  e.target.classList.add('active');

  if(id === 'panel-seireki') document.getElementById('seireki-input').focus();
  else if (id === 'panel-gengo') document.getElementById('gengo-year-input').focus();
}

function formatYear(n) { return n === 1 ? '元年' : n + '年'; }

function convertToGengo() {
  const input = document.getElementById('seireki-input');
  const resultDiv = document.getElementById('result-seireki');
  const year = parseInt(input.value);
  if (isNaN(year)) { showResult(resultDiv, '西暦を入力してください。', 'error'); return; }

  const matches = eras.filter(e => year >= e.startYear && year <= e.endYear);
  if (matches.length === 0) { showResult(resultDiv, '変換できませんでした。', 'error'); return; }

  const gengoTexts = matches.map(e => `${e.name}${formatYear(year - e.offset)}`);
  const gengoStr = gengoTexts.join(' / ');

  showResult(resultDiv, `西暦 ${year}年 は<br><span style="font-size: 1.2em;">${gengoStr}</span>`, 'success');
}

function convertToSeireki() {
  const selectVal = document.getElementById('gengo-select').value;
  const yearInput = document.getElementById('gengo-year-input');
  const resultDiv = document.getElementById('result-gengo');
  const gengoYear = parseInt(yearInput.value);
  if (isNaN(gengoYear) || gengoYear < 1) { showResult(resultDiv, '正しい年を入力してください。', 'error'); return; }

  const era = eras.find(e => e.key === selectVal);
  const seirekiYear = gengoYear + era.offset;
  if (seirekiYear > era.endYear) { showResult(resultDiv, `${era.name}は最大 ${formatYear(era.endYear - era.offset)} までです。`, 'error'); return; }

  showResult(resultDiv, `${era.name}${formatYear(gengoYear)} は<br><span style="font-size: 1.2em;">西暦 ${seirekiYear}年</span>`, 'success');
}

function showResult(el, html, type) { 
  el.innerHTML = html; 
  el.className = 'result show ' + type; 
}

// 早見表を動的に生成する関数
function generateQuickReference() {
  const tbody = document.querySelector('#quick-reference-table tbody');
  const currentYear = new Date().getFullYear();
  let html = '';
  let isEven = false; // 背景色のストライプ制御用

  // 1868年から現在の年まで昇順でループ
  for (let y = 1868; y <= currentYear; y++) {
    // 該当する元号を取得し、古い元号が上になるように（例: 明治 -> 大正）
    const matches = eras.filter(e => y >= e.startYear && y <= e.endYear);

    // 西暦の「年」単位で背景色を交互に変える
    const bgClass = isEven ? 'bg-even' : 'bg-odd';
    isEven = !isEven;

    if (matches.length === 1) {
      // 通常の年
      const gengoText = `${matches[0].name}${formatYear(y - matches[0].offset)}`;
      html += `<tr class="${bgClass}"><td>${y}年</td><td>${gengoText}</td></tr>`;
    } else {
      // 改元年（元号が複数ある場合）
      // 1行目（西暦セルをrowspanで結合）
      html += `<tr class="${bgClass}"><td rowspan="${matches.length}">${y}年</td><td>${matches[0].name}${formatYear(y - matches[0].offset)}</td></tr>`;
      // 2行目以降
      for (let i = 1; i < matches.length; i++) {
        html += `<tr class="${bgClass}"><td>${matches[i].name}${formatYear(y - matches[i].offset)}</td></tr>`;
      }
    }
  }
  tbody.innerHTML = html;

  // スクロールエリア要素を取得し、一番下までスクロールさせる
  const scrollArea = document.querySelector('.table-scroll');
  if (scrollArea) {
    scrollArea.scrollTop = scrollArea.scrollHeight;
  }
}
</script>
</body>
</html>
